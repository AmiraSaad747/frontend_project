<footer class="footer">

  <div class="footer-content">

    <!-- BRAND -->
    <div class="footer-brand">

      <div class="footer-logo">
        <span>M</span>
        ModaGo
      </div>

      <p>
        Discover your style.
        Support local fashion brands.
        Shop with confidence.
      </p>

    </div>


    <!-- SHOP -->
    <div class="footer-column">

      <h3>Shop</h3>

      <!-- All Products -->
      <a [routerLink]="['/products']">
        All Products
      </a>

      <!-- Dresses -->
      <a
        [routerLink]="['/products']"
        [queryParams]="{ category: 'dresses' }">
        Dresses
      </a>

      <!-- Shirts -->
      <a
        [routerLink]="['/products']"
        [queryParams]="{ category: 'shirts' }">
        Shirts
      </a>

      <!-- Shoes -->
      <a
        [routerLink]="['/products']"
        [queryParams]="{ category: 'shoes' }">
        Shoes
      </a>

    </div>


    <!-- ACCOUNT -->
    <div class="footer-column">

      <h3>Account</h3>

      <a routerLink="/signin">
        Sign In
      </a>

      <a routerLink="/signup">
        Create Account
      </a>

      <a routerLink="/cart">
        Shopping Cart
      </a>

    </div>


    <!-- CONTACT -->
    <div class="footer-column">

      <h3>Contact</h3>

      <p>
        Email: hello@modago.com
      </p>

      <p>
        Phone: +20 100 000 0000
      </p>

    </div>

  </div>


  <div class="footer-bottom">

    <p>
      © 2026 ModaGo. All rights reserved.
    </p>

  </div>

</footer>
