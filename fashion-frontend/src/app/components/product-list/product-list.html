<div class="product-list">

  @if (loading()) {

    <p class="loading">
      Loading products...
    </p>

  }


  @else if (errorMessage()) {

    <p class="error">
      {{ errorMessage() }}
    </p>

  }


  @else if (products().length === 0) {

    <p class="empty">
      No products found.
    </p>

  }


  @else {

    <div class="products-grid">

      @for (
        product of products();
        track product._id
      ) {

        <app-product-card
          [product]="product"
        />

      }

    </div>

  }

</div>
